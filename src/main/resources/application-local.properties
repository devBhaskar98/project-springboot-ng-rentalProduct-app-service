server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/dev-test-realm
logging.level.org.springframework.security=TRACE
#app.security.enabled:false


#Disable the Eureka registration
spring.cloud.discovery.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/rental_product
spring.datasource.username=postgres
spring.datasource.password=iamroot
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Configuration
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CACHE SETTING
#spring.cache.type=

spring.cache.type=redis
spring.cache.host=localhost
spring.cache.port=6379
spring.cache.redis.time-to-live=20000


# KAFKA SETTING
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


### FILE UPLOAD SETTINGS
spring.servlet.multipart.max-file-size=600KB
spring.servlet.multipart.max-request-size=800KB